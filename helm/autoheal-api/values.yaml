replicaCount: 2

# maxUnavailable: 0 means a new pod must pass its readiness probe before an old
# one is removed, which is what keeps rollouts at zero failed requests.
strategy:
  maxUnavailable: 0
  maxSurge: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Soft (preferred) rather than hard: kind has 2 workers but the HPA scales to 8,
# so a hard rule would leave pods permanently Pending once replicas exceed nodes.
podAntiAffinity:
  enabled: true
  type: preferred

image:
  repository: autoheal-api
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: nginx
  host: autoheal.local
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 128Mi

env:
  PORT: "3000"
  STARTUP_DELAY_MS: "2000"
  MAX_HANG_MS: "30000"
  MAX_WORK_MS: "5000"
  MAX_UNREADY_SECONDS: "300"

serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  # kube-prometheus-stack only discovers ServiceMonitors carrying its release
  # label, so this must match the release name used to install that chart.
  labels:
    release: monitoring

probes:
  startup:
    path: /startupz
    periodSeconds: 2
    failureThreshold: 15
  liveness:
    path: /healthz
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
