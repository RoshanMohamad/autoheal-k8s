replicaCount: 2

# maxUnavailable: 0 means a new pod must pass its readiness probe before an old
# one is removed, which is what keeps rollouts at zero failed requests.
strategy:
  maxUnavailable: 0
  maxSurge: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Spreads replicas across nodes. topologySpreadConstraints is used rather than
# preferred podAntiAffinity because the latter is only a scheduler hint that
# node-resource scoring routinely outweighs - in testing it placed both replicas
# on a single node, which is exactly what this is supposed to prevent.
# whenUnsatisfiable: ScheduleAnyway keeps the HPA able to scale past the node
# count; DoNotSchedule would leave pods Pending once replicas exceed nodes.
topologySpread:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway

image:
  repository: autoheal-api
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: nginx
  host: autoheal.local
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 128Mi

env:
  PORT: "3000"
  STARTUP_DELAY_MS: "2000"
  # Must exceed livenessProbe periodSeconds x failureThreshold (10 x 3 = 30s)
  # with margin, or /hang gets clamped to almost exactly the probe budget and
  # the third failure races the end of the hang.
  MAX_HANG_MS: "60000"
  MAX_WORK_MS: "5000"
  MAX_UNREADY_SECONDS: "300"

serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  # kube-prometheus-stack only discovers ServiceMonitors carrying its release
  # label, so this must match the release name used to install that chart.
  labels:
    release: monitoring

probes:
  startup:
    path: /startupz
    periodSeconds: 2
    failureThreshold: 15
  liveness:
    path: /healthz
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
