name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm test

      - name: Build image
        run: docker build -t autoheal-api:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: autoheal-api:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/autoheal-api
          docker tag autoheal-api:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag autoheal-api:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  # Rolls the scanned image out to GKE. The cluster itself is created and torn
  # down by hand (infra/gke/up.sh, down.sh) so CI never starts a paid cluster;
  # set the GKE_DEPLOY repository variable to 'true' only while it is up.
  # One-time auth setup: infra/gke/ci-setup.sh.
  deploy-gke:
    needs: build-test-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GKE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write # OIDC token for Workload Identity Federation
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      ZONE: ${{ vars.GKE_ZONE || 'us-central1-a' }}
      CLUSTER: ${{ vars.GKE_CLUSTER || 'autoheal' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Copy the exact image Trivy scanned instead of rebuilding it.
      - name: Push image to Artifact Registry
        run: |
          SRC=ghcr.io/${{ github.repository }}/autoheal-api:${{ github.sha }}
          DST=$REGION-docker.pkg.dev/$PROJECT_ID/autoheal/autoheal-api:${{ github.sha }}
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker pull "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"
          echo "IMAGE_REPO=${DST%:*}" >> "$GITHUB_ENV"

      - uses: azure/setup-helm@v4

      # --reuse-values keeps what up.sh set (e.g. serviceMonitor.enabled);
      # no --install, so this fails loudly if up.sh has not been run.
      - name: Rolling update
        run: |
          helm upgrade autoheal ./helm/autoheal-api --reuse-values \
            --set image.repository="$IMAGE_REPO" \
            --set image.tag="${{ github.sha }}" \
            --wait --timeout 10m

  # Same flow as deploy-gke, for OKE. Created and torn down by hand
  # (infra/oke/up.sh, down.sh); set OKE_DEPLOY to 'true' only while it is up.
  # One-time auth setup: infra/oke/ci-setup.sh, then up.sh with CI_GROUP_NAME.
  # OCI has no OIDC federation as simple as Azure/GCP's, so this authenticates
  # with the API signing key ci-setup.sh created instead of id-token: write.
  deploy-oke:
    needs: build-test-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.OKE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      REGION: ${{ vars.OCI_CLI_REGION }}
      CLUSTER: ${{ vars.OCI_CLUSTER || 'autoheal' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oracle-actions/configure-ociauth@v1
        with:
          user: ${{ secrets.OCI_CLI_USER }}
          tenancy: ${{ secrets.OCI_CLI_TENANCY }}
          fingerprint: ${{ secrets.OCI_CLI_FINGERPRINT }}
          private-key: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          region: ${{ env.REGION }}

      - name: kubectl credentials
        run: |
          CLUSTER_ID=$(oci ce cluster list --compartment-id "$COMPARTMENT_OCID" \
            --name "$CLUSTER" --lifecycle-state ACTIVE --query 'data[0].id' --raw-output)
          oci ce cluster create-kubeconfig --cluster-id "$CLUSTER_ID" --file "$HOME/.kube/config" \
            --region "$REGION" --token-version 2.0.0 --kube-endpoint PUBLIC_ENDPOINT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to OCIR
        run: |
          REGION_KEY=$(oci iam region list --query "data[?name=='$REGION'].key | [0]" --raw-output | tr 'A-Z' 'a-z')
          NAMESPACE=$(oci os ns get --query data --raw-output)
          SRC=ghcr.io/${{ github.repository }}/autoheal-api:${{ github.sha }}
          DST=$REGION_KEY.ocir.io/$NAMESPACE/autoheal-api:${{ github.sha }}
          echo "${{ secrets.OCIR_AUTH_TOKEN }}" | docker login "$REGION_KEY.ocir.io" \
            --username "$NAMESPACE/${{ vars.OCI_USER_NAME }}" --password-stdin
          docker pull "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"
          echo "IMAGE_REPO=${DST%:*}" >> "$GITHUB_ENV"

      - uses: azure/setup-helm@v4

      # --reuse-values keeps what up.sh set (e.g. serviceMonitor.enabled);
      # no --install, so this fails loudly if up.sh has not been run.
      - name: Rolling update
        run: |
          helm upgrade autoheal ./helm/autoheal-api --reuse-values \
            --set image.repository="$IMAGE_REPO" \
            --set image.tag="${{ github.sha }}" \
            --wait --timeout 10m
