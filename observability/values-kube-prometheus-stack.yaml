# Tuned for a local kind cluster on a laptop: short retention, small footprint.
# Install with:
#   helm install monitoring prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f observability/values-kube-prometheus-stack.yaml

prometheus:
  prometheusSpec:
    retention: 2h
    retentionSize: 1GB
    scrapeInterval: 15s
    evaluationInterval: 15s
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi
    # Discover ServiceMonitors/PrometheusRules from any namespace that carries
    # the release label, rather than only those created by this chart.
    serviceMonitorSelectorNilUsesHelmValues: true
    ruleSelectorNilUsesHelmValues: true

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

grafana:
  adminPassword: admin
  defaultDashboardsTimezone: browser
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  # Picks up any ConfigMap labelled grafana_dashboard="1", which is how the
  # autoheal dashboard gets loaded.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# kind's control-plane does not expose these components on the expected
# interfaces, so scraping them only produces permanently-down targets.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
