# Tuned for a local kind cluster on a laptop: short retention, small footprint.
# Install with:
#   helm install monitoring prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f observability/values-kube-prometheus-stack.yaml

prometheus:
  prometheusSpec:
    retention: 2h
    retentionSize: 1GB
    scrapeInterval: 15s
    evaluationInterval: 15s
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi
    # Discover ServiceMonitors/PrometheusRules from any namespace that carries
    # the release label, rather than only those created by this chart.
    serviceMonitorSelectorNilUsesHelmValues: true
    ruleSelectorNilUsesHelmValues: true
    # Ships every scraped sample to Grafana Cloud so dashboards can be built
    # and viewed there instead of running Grafana locally (see grafana.enabled
    # below). Credentials come from the grafana-cloud-credentials Secret,
    # created out-of-band with `kubectl create secret` - never committed here.
    remoteWrite:
      - url: https://prometheus-prod-55-prod-gb-south-1.grafana.net/api/prom/push
        basicAuth:
          username:
            name: grafana-cloud-credentials
            key: username
          password:
            name: grafana-cloud-credentials
            key: password
        # Unfiltered, this ships every kube-state-metrics/node-exporter/apiserver
        # series too - far more volume than this laptop's uplink can keep up
        # with (the queue backlogged to 500k+ pending samples). Keep only what
        # grafana-dashboard.json and alert-rules.yaml actually query.
        writeRelabelConfigs:
          - sourceLabels: [__name__]
            regex: "up|ALERTS|ALERTS_FOR_STATE|http_request_duration_seconds_bucket|http_request_duration_seconds_count|http_request_duration_seconds_sum|process_cpu_seconds_total|process_resident_memory_bytes|kube_deployment_metadata_generation|kube_deployment_spec_replicas|kube_deployment_status_replicas_available|kube_deployment_status_replicas_ready|kube_deployment_status_replicas_unavailable|kube_horizontalpodautoscaler_spec_max_replicas|kube_horizontalpodautoscaler_spec_min_replicas|kube_horizontalpodautoscaler_status_current_replicas|kube_horizontalpodautoscaler_status_desired_replicas|kube_pod_container_status_restarts_total|kube_pod_status_ready|kube_poddisruptionbudget_status_expected_pods|kube_poddisruptionbudget_status_current_healthy|kube_node_info|node_memory_MemAvailable_bytes|node_memory_MemTotal_bytes|node_cpu_seconds_total|container_cpu_usage_seconds_total"
            action: keep

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

# Local Grafana is disabled: etcd on this laptop is disk-bound, and Grafana's
# boot kept crash-looping the whole node under that I/O pressure. Metrics are
# shipped via prometheus.prometheusSpec.remoteWrite (above) to Grafana Cloud
# instead - dashboards live there, not on this cluster.
grafana:
  enabled: false

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# kind's control-plane does not expose these components on the expected
# interfaces, so scraping them only produces permanently-down targets.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
